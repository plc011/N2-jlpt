<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>N2 高频词汇 · 四选一冲刺</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --ink:#1c1f26; --sub:#6b7280; --line:#e5e7eb;
  --accent:#3b5bdb; --ok:#1f9d55; --okbg:#e9f7ef; --bad:#d64545; --badbg:#fdecec;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans","Yu Gothic",system-ui,sans-serif;}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
header h1{font-size:22px;margin:0 0 6px;letter-spacing:.02em}
header p{margin:0;color:var(--sub);font-size:13px;line-height:1.7}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 14px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 13px;font-size:13px;color:var(--sub);cursor:pointer;
  font-family:inherit;transition:.15s}
.seg button.on{background:var(--ink);color:#fff}
.seg button:not(.on):hover{background:#f0f1f3}
.ghost{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:9px;
  padding:8px 13px;font-size:13px;cursor:pointer;color:var(--sub);font-family:inherit}
.ghost:hover{color:var(--ink)}
.card{background:var(--card);border-radius:16px;padding:26px 26px 22px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.04)}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);letter-spacing:.02em}
.progress{height:4px;background:#eef0f3;border-radius:99px;margin:10px 0 30px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .25s}
.qwrap{text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.qtip{font-size:12px;color:var(--sub);letter-spacing:.08em}
.word{font-size:62px;line-height:1.15;font-weight:600;letter-spacing:.03em;font-family:"Hiragino Sans","Yu Gothic","MS Gothic",sans-serif}
.word.kana{font-size:50px;letter-spacing:.06em}
.hint{font-size:15px;color:var(--sub)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
@media(max-width:560px){.opts{grid-template-columns:1fr}.word{font-size:50px}.word.kana{font-size:40px}}
.opt{display:flex;align-items:center;gap:12px;background:#fbfbfc;border:1.5px solid var(--line);
  border-radius:12px;padding:15px 16px;font-size:21px;cursor:pointer;transition:.12s;font-family:inherit;
  color:var(--ink);text-align:left}
.opt:hover:not(.done){border-color:#c9ccd3;background:#fff}
.opt .num{width:22px;height:22px;flex:0 0 22px;border-radius:6px;background:#eceef1;color:var(--sub);
  font-size:12px;display:flex;align-items:center;justify-content:center;font-family:system-ui}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .num{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .num{background:var(--bad);color:#fff}
.opt.done{cursor:default}
.opt.dim{opacity:.45}
.fb{margin-top:22px;min-height:62px;border-top:1px dashed var(--line);padding-top:16px}
.fb .res{font-size:14px;font-weight:600}
.fb .res.ok{color:var(--ok)} .fb .res.bad{color:var(--bad)}
.fb .ans{font-size:15px;margin-top:7px;line-height:1.8}
.fb .stat{font-size:12.5px;color:var(--sub);margin-top:5px}
.actions{display:flex;justify-content:center;margin-top:18px}
.next{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:12px 34px;font-size:15px;
  cursor:pointer;font-family:inherit;letter-spacing:.05em}
.next:hover{opacity:.88}
.next:disabled{opacity:.25;cursor:default}
.speakrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.spk{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:13px;
  color:#374151;cursor:pointer;font-family:inherit}
.spk:hover{border-color:#c9ccd3}
.spk:active{transform:scale(.98)}
.voicehint{margin-top:10px;font-size:12.5px;color:#b45309;line-height:1.7}
.spk.star{color:#b45309}
.listtop{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.listtop .ghost{padding:6px 12px;font-size:13px}
.listtop .on{border-color:var(--ink);color:var(--ink)}
.favc{width:30px;text-align:center;cursor:pointer;color:#f59e0b;font-size:16px;user-select:none}
.favc.off{color:#d1d5db}
.empty{text-align:center;color:var(--sub);font-size:14px;line-height:2.2;padding:26px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:500;font-size:12.5px;position:sticky;top:0;background:var(--card)}
td.rk{color:var(--sub);font-size:12.5px;width:44px}
td.k{font-size:18px;font-family:"Hiragino Sans","Yu Gothic",sans-serif}
td.kana{color:#374151;font-family:"Hiragino Sans","Yu Gothic",sans-serif}
td.zh{color:var(--sub);font-size:13px}
td.n{color:var(--sub);font-size:12.5px;white-space:nowrap;text-align:right}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;
  margin-bottom:14px;font-family:inherit;outline:none}
.search:focus{border-color:#b9bee8}
.list{max-height:70vh;overflow:auto}
.hidden{display:none}
footer{margin-top:20px;color:#9aa0aa;font-size:11.5px;line-height:1.9;text-align:center}
</style>
</head>

function pickVoice(){
  if(!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices() || [];
  jaVoice = vs.find(v => /^ja[-_]JP/i.test(v.lang)) || vs.find(v => /^ja/i.test(v.lang)) || null;
  return jaVoice;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, rate){
  if(!('speechSynthesis' in window)) return;
  try{
    if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = rate || 0.9;
    const v = pickVoice();
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

  if(voiceWarned || pickVoice()) return "";

function buildQueue(){
  let pool = QUESTIONS.filter(q => (wrongOnly || favOnly) ? true : q.rank <= range);
  if(mode !== "m") pool = pool.filter(q => q.t === mode);
  if(wrongOnly){
    pool = pool.filter(q => st.wrong[q.t + ":" + q.k + ":" + q.r]);
  }
  if(favOnly){
    pool = pool.filter(q => st.fav[q.k + ":" + q.r]);
  }
  // 每题选项里补上正确答案并打乱
  queue = pool.map(q => {
    const ans = q.t === "r" ? q.r : q.k;
    const opts = [ans].concat(q.opt).slice(0, 4);
    return {q:q, ans:ans, opts:shuffle(opts), key:q.t + ":" + q.k + ":" + q.r};
  });
  queue = shuffle(queue);
  idx = 0; stat = {n:0, ok:0, streak:0};
  render();
}

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function render(){
  const total = queue.length;
  document.getElementById("mLeft").textContent = total ? `第 ${Math.min(idx+1,total)} / ${total} 题` : "第 0 / 0 题";

  const optsBox = document.getElementById("opts");
  const fb = document.getElementById("fb");
  const next = document.getElementById("btnNext");

  next.disabled = true;
  next.textContent = "下一题　空格";
  fb.innerHTML = "";
  optsBox.innerHTML = "";

  if(!total){
    document.getElementById("qtip").textContent = "";
    document.getElementById("word").textContent = wrongOnly ? "没有错题" : "—";
    document.getElementById("word").className = "word";
    document.getElementById("hint").textContent = wrongOnly ? "先做几题，答错的会自动进来" : "";
    return;
  }
  if(idx >= total){
    document.getElementById("qtip").textContent = "";
    document.getElementById("word").textContent = "完成";
    document.getElementById("word").className = "word";
    document.getElementById("hint").textContent = `共 ${total} 题，答对 ${stat.ok} 题，正确率 ${Math.round(stat.ok/total*100)}%`;
    document.getElementById("bar").style.width = "100%";
    next.disabled = false;
    next.textContent = "重新开始";
    return;
  }

  cur = queue[idx];
  const q = cur.q;
  document.getElementById("qtip").textContent = q.t === "r" ? "这个汉字的读音是？" : "这个读音对应哪个汉字？";
  const w = document.getElementById("word");
  w.textContent = q.t === "r" ? q.k : q.r;
  w.className = "word" + (q.t === "r" ? "" : " kana");
  document.getElementById("hint").textContent = q.t === "r" ? q.zh.split("；")[0] : q.zh.split("；")[0];

  cur.opts.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="num">${i+1}</span><span>${o}</span>`;
    b.onclick = () => choose(i);
    optsBox.appendChild(b);
  });
}

function choose(i){
  if(answered || !cur || idx >= queue.length) return;
  answered = true;
  stat.n++;
  const btns = [...document.querySelectorAll(".opt")];
  const q = cur.q;
  const ok = cur.opts[i] === cur.ans;
  btns.forEach((b, j) => {
    b.classList.add("done");
    if(cur.opts[j] === cur.ans) b.classList.add("ok");
    else if(j === i) b.classList.add("bad");
    else b.classList.add("dim");
  });

  if(ok){
    stat.ok++; stat.streak++;
    delete st.wrong[cur.key];
  } else {
    stat.streak = 0;
    st.wrong[cur.key] = 1;
  }
  save();

  const fb = document.getElementById("fb");
  fb.innerHTML =
    `<div class="res ${ok?"ok":"bad"}">${ok ? "✓ 正确" : "✗ 错了"}</div>` +
    `<div class="ans"><b>${q.k}</b>　${q.r}　<span style="color:var(--sub)">${q.zh}</span></div>` +
    `<div class="stat">该词在全真题中出现 ${q.cnt} 次，覆盖 ${q.papers} 套 · 词频排名第 ${q.rank}</div>` +

    `<button class="spk star" id="btnStar">${st.fav[q.k + ":" + q.r] ? "★ 已收藏" : "☆ 收藏"}</button></div>` +
    voiceHint();

    b.onclick = () => speak(q.r, parseFloat(b.dataset.rate));

    const fk = q.k + ":" + q.r;
    if(st.fav[fk]) delete st.fav[fk]; else st.fav[fk] = 1;
    save();
    starBtn.textContent = st.fav[fk] ? "★ 已收藏" : "☆ 收藏";
    renderMeta();
  };
  if(autoSpeak) speak(q.r, 0.9);

  document.getElementById("btnNext").disabled = false;
  renderMeta();

function renderMeta(){
  const total = queue.length;
  const acc = stat.n ? Math.round(stat.ok / stat.n * 100) + "%" : "—";
  document.getElementById("mRight").textContent = `正确率 ${acc}　连对 ${stat.streak}`;
  document.getElementById("btnWrong").textContent = `只练错题 (${Object.keys(st.wrong).length})`;

document.getElementById("btnWrong").onclick = () => {
  wrongOnly = !wrongOnly;
  document.getElementById("btnWrong").style.color = wrongOnly ? "var(--ink)" : "";
  document.getElementById("btnWrong").style.borderColor = wrongOnly ? "var(--ink)" : "";
  buildQueue();
};

document.getElementById("btnFav").onclick = () => {
  favOnly = !favOnly;
  const b = document.getElementById("btnFav");
  b.style.color = favOnly ? "var(--ink)" : "";
  b.style.borderColor = favOnly ? "var(--ink)" : "";
  buildQueue();
};

document.getElementById("btnList").onclick = () => {
  const lv = document.getElementById("listView");
  const pv = document.getElementById("practice");
  const showList = lv.classList.contains("hidden");
  lv.classList.toggle("hidden", !showList);
  pv.classList.toggle("hidden", showList);
  document.getElementById("btnList").textContent = showList ? "返回练习" : "词表";
  if(showList) drawList("");
};

document.getElementById("btnListFav").onclick = () => {
  listFavOnly = !listFavOnly;
  document.getElementById("btnListFav").classList.toggle("on", listFavOnly);
  drawList(document.getElementById("search").value.trim());
};

const search = document.getElementById("search");
search.oninput = () => drawList(search.value.trim());

function drawList(kw){
  const box = document.getElementById("listBox");
  let rows = WORDS;
  if(listFavOnly) rows = rows.filter(r => st.fav[r[1] + ":" + r[2]]);
  if(kw){
    const k = kw.toLowerCase();
    rows = rows.filter(r => (r[1]||"").includes(kw) || r[2].includes(kw) || (r[3]||"").toLowerCase().includes(k));
  }
  let html = `<table><thead><tr><th>★</th><th>#</th><th>词</th><th>假名</th><th>释义</th><th>出现</th></tr></thead><tbody>`;
  for(const r of rows){
    const fk = r[1] + ":" + r[2];
    html += `<tr><td class="favc${st.fav[fk] ? "" : " off"}" data-fk="${fk}">${st.fav[fk] ? "★" : "☆"}</td>` +
            `<td class="rk">${r[0]}</td><td class="k">${r[1]||r[2]}</td><td class="kana">${r[1]?r[2]:""}</td>` +
            `<td class="zh">${r[3]||""}</td><td class="n">${r[4]} 次 / ${r[5]} 套</td></tr>`;
  }
  html += `</tbody></table>`;
  box.innerHTML = rows.length ? html : `<div class="empty">没有匹配的词</div>`;
  box.querySelectorAll(".favc").forEach(td => td.onclick = () => {
    const fk = td.dataset.fk;
    if(st.fav[fk]) delete st.fav[fk]; else st.fav[fk] = 1;
    save();
    td.textContent = st.fav[fk] ? "★" : "☆";
    td.classList.toggle("off", !st.fav[fk]);
    renderMeta();
  });
}

buildQueue();
</script>
</body>
</html>
